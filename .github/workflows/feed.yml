name: feed
on:
  schedule: [{ cron: "23 1,4,7,10,13,16,19,22 * * *" }]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: feed }
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - id: f
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python3 fetch.py
      - if: github.event_name == 'workflow_dispatch' || (github.event.schedule && true)
        run: '[ "$(date -u +%u)" = 7 ] || [ ! -s in/reviews.json ] && python3 reviews.py || true'
      - run: |
          git config user.name autopost-feed && git config user.email autopost-feed@users.noreply.github.com
          git add -A in && (git diff --cached --quiet || (git commit -qm "feed" && git pull -q --rebase origin main && git push -q origin HEAD:main))
      - if: steps.f.outputs.alert == '1'
        run: echo "POSTING PROBLEM" && cat in/alert.json && exit 1
