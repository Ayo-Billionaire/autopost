name: cards
on:
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: cards }
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: pip install -q playwright==1.55.0
      - run: python3 cards/run.py
      - run: |
          git config user.name autopost-feed && git config user.email autopost-feed@users.noreply.github.com
          git add -A cards/out && (git diff --cached --quiet || (git commit -qm cards && git pull -q --rebase origin main && git push -q origin HEAD:main))
      - run: '[ "$(cat cards/out/alert.json)" = "[]" ] || { echo "POSTING PROBLEM"; cat cards/out/alert.json; exit 1; }'
